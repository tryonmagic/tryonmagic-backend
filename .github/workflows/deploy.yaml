name: CD [package & update deployment spec]
on:
  push:
    branches: [main]
    tags: ['v*']

permissions:
  contents: read
  packages: write

jobs:
  deploy:
    uses: ./.github/workflows/docker-build-and-push.yaml
    with:
      environment: ${{ github.ref_type == 'tag' && 'prod' || 'stg' }}
      tag: ${{ github.ref_type == 'tag' && github.ref_name || github.sha }}