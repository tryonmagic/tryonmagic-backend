on:
  workflow_call:
    inputs:
      environment:
        required: true
        type: string
      tag:
        required: true
        type: string

jobs:
  cd:
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    steps:
      - name: echo token
        run: echo ${{ secrets.GHCR_TOKEN }}

      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: timam
          password: ${{ secrets.GHCR_TOKEN }}

      - name: Define environment and tag
        id: vars
        run: |
          if [[ "${{ github.ref_type }}" == "tag" ]]
          then
            echo "TAG=${{ github.ref_name }}" >> $GITHUB_ENV
            echo "ENV=prod" >> $GITHUB_ENV
          else
            echo "TAG=${{ github.sha }}" >> $GITHUB_ENV
            echo "ENV=stg" >> $GITHUB_ENV
          fi

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ghcr.io/${{ github.repository }}:${{ env.TAG }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          platforms: linux/amd64,linux/arm64

      # - name: Update deployment repository with docker image tag
      #   uses: printnowstack/pvr-action/update-deployment@main
      #   with:
      #     tag: ${{ env.TAG }}
      #     microservice-name: ${{ github.event.repository.name }}
      #     deployment-env: "${{ env.ENV }}"
      #     deploy-key: ${{ secrets.DEPLOY_KEY }}