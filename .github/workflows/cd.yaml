name: Continuous Deployment
on:
  push:
    branches: [main]
    tags: ['v*']

permissions:
  contents: read
  packages: write

jobs:
  cd:
    uses: ./.github/workflows/build.yaml
    with:
      environment: ${{ github.ref_type == 'tag' && 'prod' || 'stg' }}
      tag: ${{ github.ref_type == 'tag' && github.ref_name || github.sha }}